<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白地図演習 — 都道府県トレーニング</title>
<style>
:root{
  --paper:#fbfaf6; --ink:#1f2a44; --sub:#6b7385;
  --blue:#2456c7; --blue-soft:#e7eefb;
  --red:#d63b2f; --red-soft:#fdeae8;
  --green:#3e8e5a; --green-soft:#e3f2e8;
  --yellow:#d99a1f;
  --sea:#e3edf3; --land:#f4f0e4; --border:#9aa3b5;
  --line:#d8d4c8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",YuGothic,"Meiryo",sans-serif;
  background:var(--paper); color:var(--ink); min-height:100vh;
}
header{
  border-bottom:2px solid var(--ink); padding:14px 20px 10px;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
header h1{font-size:20px; letter-spacing:.12em; font-weight:800}
header .tagline{font-size:12px; color:var(--sub); letter-spacing:.06em}
.controls{
  display:flex; gap:8px; flex-wrap:wrap; padding:12px 20px; align-items:center;
  border-bottom:1px solid var(--line);
}
.tabs{display:flex; gap:0; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden}
.tabs button{
  border:none; background:transparent; padding:8px 14px; font:inherit; font-size:13px;
  font-weight:700; color:var(--ink); cursor:pointer; border-right:1.5px solid var(--ink);
}
.tabs button:last-child{border-right:none}
.tabs button.on{background:var(--ink); color:#fff}
select{
  font:inherit; font-size:13px; font-weight:700; padding:8px 10px;
  border:1.5px solid var(--ink); border-radius:8px; background:#fff; color:var(--ink);
}
.startbtn{
  margin-left:auto; font:inherit; font-size:14px; font-weight:800; letter-spacing:.08em;
  padding:9px 22px; border:none; border-radius:8px; background:var(--blue); color:#fff; cursor:pointer;
}
.startbtn:hover{filter:brightness(1.08)}
main{display:grid; grid-template-columns:minmax(0,1.85fr) minmax(300px,.55fr); gap:0; max-width:1800px; margin:0 auto}
@media(max-width:820px){ main{grid-template-columns:1fr} .panel{order:-1; border-left:none; border-bottom:1px solid var(--line)} }
.mapwrap{padding:10px; position:relative}
#map{height:auto; display:block; margin:0 auto}
.pref{fill:var(--land); stroke:var(--border); stroke-width:.8; cursor:pointer; transition:fill .12s}
.pref:hover{fill:#e6ddc2}
.pref.target{fill:var(--blue); stroke:#163a8c}
.pref.dim{cursor:default; fill:#eceae2; stroke:#c5cad4}
.pref.dim:hover{fill:#eceae2}
.pref.ok1{fill:#9ecfae}
.pref.ok2{fill:#ecd28a}
.pref.ng{fill:#eba197}
.pref.flash-ok{fill:var(--green)}
.pref.flash-ng{fill:var(--red)}
.okibox{fill:none; stroke:var(--border); stroke-width:1; stroke-dasharray:4 4}
.panel{border-left:1px solid var(--line); padding:18px; display:flex; flex-direction:column; gap:14px; min-height:420px}
.qlabel{font-size:11px; font-weight:800; letter-spacing:.25em; color:var(--sub)}
.qnum{font-size:12px; color:var(--sub); font-weight:700}
.question{font-size:21px; font-weight:800; line-height:1.5}
.question .big{font-size:30px; color:var(--blue)}
.choices{display:grid; gap:8px}
.choices button{
  font:inherit; font-size:17px; font-weight:700; text-align:left; padding:11px 14px;
  border:1.5px solid var(--ink); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer;
}
.choices button:hover{background:var(--blue-soft)}
.choices button.right{background:var(--green-soft); border-color:var(--green); color:var(--green)}
.choices button.wrong{background:var(--red-soft); border-color:var(--red); color:var(--red)}
.choices button:disabled{cursor:default}
.feedback{font-size:15px; font-weight:800; min-height:24px}
.feedback.ok{color:var(--red)}
.feedback.ng{color:var(--blue)}
.scorebar{display:flex; gap:18px; font-size:13px; font-weight:700; color:var(--sub); border-top:1px dashed var(--line); padding-top:12px; margin-top:auto}
.scorebar b{color:var(--ink); font-size:17px}
.scorebar .maru{color:var(--red)}
.nextbtn,.retrybtn{
  font:inherit; font-size:15px; font-weight:800; padding:10px 18px; border-radius:8px; cursor:pointer; letter-spacing:.06em;
}
.nextbtn{border:none; background:var(--ink); color:#fff}
.retrybtn{border:1.5px solid var(--red); background:#fff; color:var(--red)}
.hidden{display:none !important}
.shapebox{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:6px}
.shapebox svg{width:100%; height:240px; display:block}
.shapebox path{fill:var(--land); stroke:var(--ink); stroke-width:1.4}
.summary h2{font-size:18px; font-weight:800; letter-spacing:.08em}
.summary .legend{display:flex; gap:14px; font-size:12px; font-weight:700; color:var(--sub); margin:8px 0}
.legend span::before{content:""; display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.legend .l1::before{background:#9ecfae}.legend .l2::before{background:#ecd28a}.legend .l3::before{background:#eba197}
.misslist{font-size:14px; line-height:2}
.misslist b{color:var(--red)}
.studyinfo{
  background:#fff; border:1.5px solid var(--ink); border-radius:10px; padding:14px 16px;
}
.studyinfo .pname{font-size:24px; font-weight:800}
.studyinfo .cap{font-size:15px; color:var(--sub); font-weight:700; margin-top:4px}
.studyinfo .cap b{color:var(--blue); font-size:18px}
.hint{font-size:12.5px; color:var(--sub); line-height:1.8}
/* 赤ペン丸付け */
#marupen{position:absolute; pointer-events:none; overflow:visible}
.maru-stroke{
  fill:none; stroke:var(--red); stroke-width:5; stroke-linecap:round; opacity:.92;
  stroke-dasharray:300; stroke-dashoffset:300; animation:draw .45s ease-out forwards;
}
.batsu-stroke{
  fill:none; stroke:var(--blue); stroke-width:5; stroke-linecap:round; opacity:.9;
  stroke-dasharray:120; stroke-dashoffset:120; animation:draw .3s ease-out forwards;
}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){ .maru-stroke,.batsu-stroke{animation:none; stroke-dashoffset:0} }
</style>

const NS='http://www.w3.org/2000/svg';
// 沖縄インセット枠
const box=document.createElementNS(NS,'rect');
box.setAttribute('x',OKI_BOX[0]); box.setAttribute('y',OKI_BOX[1]);
box.setAttribute('width',OKI_BOX[2]-OKI_BOX[0]); box.setAttribute('height',OKI_BOX[3]-OKI_BOX[1]);
box.setAttribute('class','okibox');
map.appendChild(box);
const els={};
for(const p of PREFS){
  const el=document.createElementNS(NS,'path');
  el.setAttribute('d',p.d); el.setAttribute('class','pref'); el.dataset.id=p.id;
  el.addEventListener('click',()=>onMapClick(p.id));
  map.appendChild(el); els[p.id]=el;
}

// ---- 赤ペン丸付け(signature) ----
const marupen=document.getElementById('marupen');
function penAt(id,kind){
  // 対象県のbboxの中心に手書き風の○/✓を重ねる
  const r=els[id].getBBox();
  const mw=document.querySelector('.mapwrap');
  marupen.setAttribute('viewBox','0 0 '+MAP_W+' '+MAP_H);
  marupen.style.left=map.offsetLeft+'px'; marupen.style.top=map.offsetTop+'px';
  marupen.style.width=map.clientWidth+'px'; marupen.style.height=map.clientHeight+'px';
  marupen.innerHTML='';
  const cx=r.x+r.width/2, cy=r.y+r.height/2;
  const rad=Math.max(28,Math.min(64,Math.max(r.width,r.height)/2+14));
  const el=document.createElementNS(NS,'path');
  if(kind==='ok'){
    // 少し歪んだ手書きの丸
    const d=`M ${cx+rad} ${cy} A ${rad} ${rad*0.92} -8 1 1 ${cx+rad*0.96} ${cy-rad*0.18}`;
    el.setAttribute('d',d); el.setAttribute('class','maru-stroke');
  }else{
    const s=rad*0.7;
    el.setAttribute('d',`M ${cx-s} ${cy-s} L ${cx+s} ${cy+s} M ${cx+s} ${cy-s} L ${cx-s} ${cy+s}`);
    el.setAttribute('class','batsu-stroke');
  }
  marupen.appendChild(el);
  setTimeout(()=>{marupen.innerHTML='';},900);
}

// ---- 状態 ----
let mode='study', regionKey='all';
let queue=[], qIndex=0, current=null, tries=0, awaiting=false, locked=false;
let results={}; // id -> 'ok1'|'ok2'|'ng'
let misses=[];
const panel=document.getElementById('panel');

document.getElementById('modeTabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  document.querySelectorAll('#modeTabs button').forEach(x=>x.classList.toggle('on',x===b));
  mode=b.dataset.mode;
  if(mode==='study') startStudy(); else renderIdle();
});
document.getElementById('regionSel').addEventListener('change',e=>{
  regionKey=e.target.value;
  if(mode==='study') startStudy(); else renderIdle();
});
document.getElementById('startBtn').addEventListener('click',()=>{
  if(mode==='study') startStudy(); else startQuiz();
});

function setMapRegion(){
  const ids=new Set(REGIONS[regionKey]);
  for(const p of PREFS){
    els[p.id].setAttribute('class','pref'+(ids.has(p.id)?'':' dim'));
  }
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ---- 白地図(学習)モード ----
function startStudy(){
  setMapRegion();
  panel.innerHTML=`
    <div class="qlabel">学習モード</div>
    <div class="question">地図の県を<span style="color:var(--blue)">タップ</span>すると<br>県名と県庁所在地が出ます</div>
    <div class="studyinfo hidden" id="studyInfo"></div>
    <div class="hint">範囲をしぼって覚えたいときは、上のメニューで地方を選んでください。<br>クイズは「位置」「県名」「形」「県庁所在地」の4種類。出題は選んだ範囲から全問1回ずつ、順番はランダムです。</div>`;
}
function onMapClick(id){
  if(!REGIONS[regionKey].includes(id))return;
  if(mode==='study'){
    const info=document.getElementById('studyInfo');
    info.classList.remove('hidden');
    info.innerHTML=`<div class="pname">${byId[id].name}</div><div class="cap">県庁所在地:<b>${CAPITALS[id]}</b></div>`;
    for(const p of PREFS) els[p.id].classList.remove('target');
    els[id].classList.add('target');
  }else if(mode==='pos'&&awaiting&&!locked){
    answerPos(id);
  }
}

// ---- クイズ共通 ----
function startQuiz(){
  queue=shuffle(REGIONS[regionKey].slice());
  qIndex=0; results={}; misses=[];
  setMapRegion();
  nextQuestion();
}
function nextQuestion(){
  if(qIndex>=queue.length){showSummary();return;}
  current=queue[qIndex]; tries=0; awaiting=true; locked=false;
  if(mode==='pos') renderPosQ();
  else if(mode==='name') renderChoiceQ('name');
  else if(mode==='shape') renderChoiceQ('shape');
  else renderChoiceQ('cap');
}
function recordResult(){
  const r=tries===0?'ok1':(tries===1?'ok2':'ng');
  results[current]=r;
  if(r!=='ok1') misses.push(current);
}
function markMap(id){
  els[id].classList.remove('target');
  els[id].classList.add(results[id]);
}
function scoreHTML(){
  const done=Object.keys(results).length;
  const maru=Object.values(results).filter(r=>r==='ok1').length;
  return `<div class="scorebar"><span>第 <b>${qIndex+1}</b> / ${queue.length} 問</span><span class="maru">一発正解 <b>${maru}</b></span></div>`;
}

// ---- 位置クイズ ----
function renderPosQ(){
  setMapRegion();
  for(const id in results) markMap2(id);
  panel.innerHTML=`
    <div class="qlabel">位置クイズ</div>
    <div class="question"><span class="big">${byId[current].name}</span> は<br>地図のどこ?</div>
    <div class="feedback" id="fb"></div>
    ${scoreHTML()}`;
}
function markMap2(id){ els[id].setAttribute('class','pref '+results[id]); }
function answerPos(id){
  const fb=document.getElementById('fb');
  if(id===Number(current)||id===current){
    locked=true; recordResult();
    els[current].classList.add('flash-ok'); penAt(current,'ok');
    fb.textContent='せいかい!'; fb.className='feedback ok';
    setTimeout(()=>{els[current].classList.remove('flash-ok'); markMap2(current); qIndex++; nextQuestion();},950);
  }else{
    tries++;
    els[id].classList.add('flash-ng'); penAt(id,'ng');
    setTimeout(()=>els[id].classList.remove('flash-ng'),500);
    if(tries>=3){
      locked=true; recordResult();
      els[current].classList.add('target');
      fb.innerHTML=`ざんねん… 正解はここ(<b>${byId[current].name}</b>)`; fb.className='feedback ng';
      setTimeout(()=>{els[current].classList.remove('target'); markMap2(current); qIndex++; nextQuestion();},1700);
    }else{
      fb.textContent='ちがうよ。あと'+(3-tries)+'回!'; fb.className='feedback ng';
    }
  }
}

// ---- 選択式クイズ(県名・形・県庁所在地) ----
function distractors(id,kind){
  // 同じ地方を優先して誤答を作る(近い県のほうが紛らわしく学習効果が高い)
  const regionIds=Object.values(REGIONS).find(ids=>ids!==REGIONS.all&&ids.includes(Number(id)))||REGIONS.all;
  const pool=shuffle(regionIds.filter(x=>x!==Number(id)));
  const rest=shuffle(REGIONS.all.filter(x=>x!==Number(id)&&!pool.includes(x)));
  const ids=pool.concat(rest).slice(0,3);
  return ids;
}
function renderChoiceQ(kind){
  setMapRegion();
  for(const id in results) markMap2(id);
  let qhtml='', shapeHtml='';
  if(kind==='name'){
    for(const p of PREFS) els[p.id].classList.remove('target');
    els[current].classList.add('target');
    qhtml=`<div class="question">青い県の<span style="color:var(--blue)">名前</span>は?</div>`;
  }else if(kind==='cap'){
    for(const p of PREFS) els[p.id].classList.remove('target');
    els[current].classList.add('target');
    qhtml=`<div class="question"><span class="big">${byId[current].name}</span> の<br>県庁所在地は?</div>`;
  }else{
    // 形クイズ:高精細シルエット(SHAPES)を使用
    const sh=SHAPES[current];
    const pad=Math.max(sh.w,sh.h)*0.08;
    shapeHtml=`<div class="shapebox"><svg viewBox="${-pad} ${-pad} ${sh.w+pad*2} ${sh.h+pad*2}"><path d="${sh.d}" vector-effect="non-scaling-stroke"/></svg></div>`;
    qhtml=`<div class="question">この<span style="color:var(--blue)">形</span>の県は?</div>`;
  }
  const opts=shuffle([Number(current),...distractors(current,kind)]);
  const label=kind==='cap'?(i=>CAPITALS[i]):(i=>byId[i].name);
  panel.innerHTML=`
    <div class="qlabel">${kind==='name'?'県名クイズ':kind==='cap'?'県庁所在地クイズ':'形クイズ'}</div>
    ${qhtml}${shapeHtml}
    <div class="choices" id="choices">${opts.map(i=>`<button data-id="${i}">${label(i)}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    ${scoreHTML()}`;
  document.getElementById('choices').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||locked)return;
    const picked=Number(b.dataset.id);
    const fb=document.getElementById('fb');
    if(picked===Number(current)){
      locked=true; recordResult();
      b.classList.add('right');
      penAt(current,'ok');
      fb.textContent='せいかい!'; fb.className='feedback ok';
      document.querySelectorAll('#choices button').forEach(x=>x.disabled=true);
      setTimeout(()=>{els[current].classList.remove('target'); markMap2(current); qIndex++; nextQuestion();},950);
    }else{
      tries++; b.classList.add('wrong'); b.disabled=true;
      if(tries>=2){
        locked=true; recordResult();
        const rightBtn=document.querySelector(`#choices button[data-id="${current}"]`);
        rightBtn.classList.add('right');
        fb.innerHTML=`正解は <b>${label(Number(current))}</b>`; fb.className='feedback ng';
        document.querySelectorAll('#choices button').forEach(x=>x.disabled=true);
        setTimeout(()=>{els[current].classList.remove('target'); markMap2(current); qIndex++; nextQuestion();},1700);
      }else{
        fb.textContent='ちがうよ。もう1回!'; fb.className='feedback ng';
      }
    }
  });
}

// ---- まとめ ----
function showSummary(){
  awaiting=false;
  for(const id in results) markMap2(id);
  const vals=Object.values(results);
  const maru=vals.filter(r=>r==='ok1').length;
  const missNames=misses.map(i=>byId[i].name);
  panel.innerHTML=`
    <div class="summary">
      <div class="qlabel">けっか</div>
      <h2>一発正解 ${maru} / ${vals.length}</h2>
      <div class="legend"><span class="l1">一発正解</span><span class="l2">おしい</span><span class="l3">まちがい</span></div>
      ${missNames.length?`<div class="misslist">復習リスト:<b>${missNames.join('・')}</b></div>`:`<div class="misslist">パーフェクト!すごい!</div>`}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${missNames.length?`<button class="retrybtn" id="retryBtn">まちがえた問題だけもう一度</button>`:''}
      <button class="nextbtn" id="againBtn">はじめから</button>
    </div>
    ${missNames.length?'<div class="hint">「まちがえた問題だけもう一度」を全部○にできたら今日は合格。</div>':''}`;
  const rb=document.getElementById('retryBtn');
  if(rb) rb.addEventListener('click',()=>{
    queue=shuffle(misses.slice()); qIndex=0; results={}; misses=[];
    setMapRegion(); nextQuestion();
  });
  document.getElementById('againBtn').addEventListener('click',startQuiz);
}

function renderIdle(){
  setMapRegion();
  const names={pos:'位置クイズ',name:'県名クイズ',shape:'形クイズ',cap:'県庁所在地クイズ'};
  panel.innerHTML=`
    <div class="qlabel">${names[mode]}</div>
    <div class="question">範囲を選んで<br><span style="color:var(--blue)">スタート</span>を押してね</div>
    <div class="hint">${mode==='pos'?'県の名前が出るので、地図でその県をタップ。3回まちがえると答えが出ます。':
      mode==='name'?'青くなった県の名前を4つの中から選びます。':
      mode==='shape'?'県の形だけを見て、どの県か当てます。地図は見ずに形だけで考えるのがコツ。':
      '県庁所在地を4つの中から選びます。県名と所在地名がちがう18県がねらわれやすいので要注意。'}</div>`;
}

// ---- 自動サイズ調整 ----
// ウィンドウの残り高さと地図カラムの幅、両方に収まる最大サイズを算出
function fitMap(){
  const wrap=document.querySelector('.mapwrap');
  if(window.matchMedia('(max-width:820px)').matches){
    map.style.width='100%';  // モバイル縦持ちは幅いっぱい
    return;
  }
  const top=wrap.getBoundingClientRect().top;
  const availH=Math.max(360, window.innerHeight-top-24);
  const availW=wrap.clientWidth-20;
  const wByH=availH*(MAP_W/MAP_H);
  map.style.width=Math.round(Math.min(availW, wByH))+'px';
}
// 初期表示
startStudy();
fitMap();
window.addEventListener('resize',()=>{marupen.innerHTML=''; fitMap();});
</script>
